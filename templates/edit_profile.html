{% extends "base.html" %}

{% block title %}
Edit Profile | ShopEase
{% endblock %}

{% block content %}

<div class="container my-5">

```
<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body p-5">

                <h2 class="text-center mb-4">
                    ✏️ Edit Profile
                </h2>

                <form method="POST" action="{{ url_for('edit_profile') }}">

                    <!-- Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label">
                            Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            value="{{ user.name }}"
                            required
                        >
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label for="email" class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            value="{{ user.email }}"
                            required
                        >
                    </div>

                    <!-- Buttons -->
                    <div class="d-grid gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            💾 Save Changes
                        </button>

                        <a
                            href="{{ url_for('profile') }}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>
```

</div>

{% endblock %}
