{% extends "base.html" %}

{% block title %}
Register | ShopEase
{% endblock %}

{% block content %}

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header text-center">
                    <h3 class="mb-0">📝 Create Account</h3>
                </div>

                <div class="card-body p-4">

                    <form method="POST"
                          action="{{ url_for('register') }}">

                        <!-- Name -->
                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   placeholder="Enter your name"
                                   required>

                        </div>

                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter your email"
                                   required>

                        </div>

                        <!-- Password -->
                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   required>

                        </div>

                        <!-- Register Button -->
                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary">
                                Create Account
                            </button>

                        </div>

                    </form>

                    <div class="text-center mt-3">

                        <p>
                           
    Already have an account?
    Login coming soon
</p>
                        
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
