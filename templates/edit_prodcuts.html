{% extends "base.html" %}

{% block title %}
Edit Product | ShopEase
{% endblock %}

{% block content %}

<div class="container my-5">

    <h1 class="mb-4">✏️ Edit Product</h1>

    <div class="card shadow p-4">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Product Name</label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ product.name }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Price</label>

                <input
                    type="number"
                    name="price"
                    class="form-control"
                    value="{{ product.price }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Image URL</label>

                <input
                    type="text"
                    name="image"
                    class="form-control"
                    value="{{ product.image }}">
            </div>

            <button
                type="submit"
                class="btn btn-primary">
                💾 Update Product
            </button>

            <a
                href="{{ url_for('admin_products') }}"
                class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
